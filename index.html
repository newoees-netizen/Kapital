<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Капитал</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Капитал">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
body:has(.app.is-ios){background:#F2F2F7}
@media (prefers-color-scheme: dark){body:has(.app.is-ios){background:#000}}
</style>
<script>window.__STANDALONE__=true;</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width app column, tab bar at the bottom; on desktop the column sits centered like a device. */
:root{
  --bg:#E6EBE8; --surface:#FBFCFB; --surface-2:#F0F3F1; --ink:#14201B; --muted:#5D6A64; --line:#D5DCD8;
  --accent:#1E5C47; --accent-ink:#FFFFFF; --accent-soft:#DCEBE4;
  --needs:#3A6E8F; --wants:#C0852A; --save:#1E5C47;
  --good:#2C7A4D; --warn:#A86E14; --bad:#B23A2B;
  --good-soft:#E1F0E6; --warn-soft:#F7EDDA; --bad-soft:#F6E1DD; --info-soft:#E3ECF2;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 8px 24px rgba(20,32,27,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B100E; --surface:#141B18; --surface-2:#1B2421; --ink:#E5ECE8; --muted:#93A29B; --line:#2A3631;
  --accent:#62B790; --accent-ink:#0B100E; --accent-soft:#1D3229;
  --needs:#73AACC; --wants:#E1AE5E; --save:#62B790;
  --good:#5FBF89; --warn:#E2A846; --bad:#E36D5C;
  --good-soft:#18301F; --warn-soft:#33281A; --bad-soft:#3A1E1A; --info-soft:#1A2933;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B100E; --surface:#141B18; --surface-2:#1B2421; --ink:#E5ECE8; --muted:#93A29B; --line:#2A3631;
  --accent:#62B790; --accent-ink:#0B100E; --accent-soft:#1D3229;
  --needs:#73AACC; --wants:#E1AE5E; --save:#62B790;
  --good:#5FBF89; --warn:#E2A846; --bad:#E36D5C;
  --good-soft:#18301F; --warn-soft:#33281A; --bad-soft:#3A1E1A; --info-soft:#1A2933;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(110px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){
  body{padding-block:24px}
  .app{border-radius:36px;border:1px solid var(--line);min-height:calc(100vh - 48px);box-shadow:var(--shadow);overflow:hidden}
}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.month button:hover{background:var(--surface-2);color:var(--ink)}
.month span{font-weight:600;font-size:14px;min-width:96px;text-align:center}
.top-r{display:flex;align-items:center;gap:6px}
.gear{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.gear:hover{color:var(--ink)}

.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--info-soft);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.demo b{font-weight:600}
.demo button{flex:none;border:0;background:var(--ink);color:var(--surface);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600}

h2.sec{font-size:12px;font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec a,h2.sec button{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:13px;color:var(--accent);font-weight:600;background:none;border:0;padding:0;text-decoration:none}

.card{background:var(--surface);border-radius:20px;padding:16px;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:10px}

/* hero */
.hero{background:var(--surface);border-radius:24px;padding:20px 18px 18px;border:1px solid var(--line)}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,10vw,44px);letter-spacing:-.03em;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--bad)}
.hero .sub{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kv div{background:var(--surface-2);border-radius:14px;padding:10px}
.kv dt{font-size:11px;color:var(--muted)}
.kv dd{margin:2px 0 0;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* split bar: 50/30/20 */
.split{margin-top:18px}
.split-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.bar{position:relative;height:14px;border-radius:7px;background:var(--surface-2);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.ticks{position:relative;height:10px}
.ticks span{position:absolute;top:0;width:2px;height:8px;background:var(--ink);opacity:.5;transform:translateX(-1px)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.legend div{font-size:12px;color:var(--muted)}
.legend b{display:block;font-size:14px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.legend em{font-style:normal;font-family:var(--f-mono);font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* hints */
.hint{display:grid;grid-template-columns:4px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 0;overflow:hidden}
.hint::before{content:"";border-radius:0 4px 4px 0}
.hint.bad::before{background:var(--bad)} .hint.warn::before{background:var(--warn)}
.hint.good::before{background:var(--good)} .hint.info::before{background:var(--needs)}
.hint h3{margin:0;font-size:15px;font-weight:600;text-wrap:balance}
.hint p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.hint p b{color:var(--ink);font-weight:600}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-bottom:5px}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.info{background:var(--info-soft);color:var(--needs)}

/* categories */
.cats{display:flex;flex-direction:column;gap:14px}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.cat-row .n{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row .v{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.cat-row .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.cat-row .track i{display:block;height:100%;border-radius:3px}
.cat-row .d{grid-column:1/-1;font-size:12px;color:var(--muted)}
.up{color:var(--bad)} .down{color:var(--good)}

/* transactions */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.day{margin-top:16px}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 4px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:0;background:transparent;width:100%;text-align:left}
.tx + .tx{border-top:1px solid var(--line)}
.tx:hover{background:var(--surface-2)}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500;color:#fff}
.tx .t{min-width:0}
.tx .t b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .a.inc{color:var(--good)}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}

/* AI */
.ai{background:var(--ink);color:var(--surface);border-radius:22px;padding:18px;border:0}
.ai h3{margin:0 0 4px;font-family:var(--f-display);font-weight:500;font-size:16px}
.ai p.lead{margin:0 0 14px;font-size:13.5px;opacity:.75}
.ai .go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 16px;font-weight:600;width:100%}
.ai .go:disabled{opacity:.6;cursor:default}
.ai-out{background:var(--surface);color:var(--ink);border-radius:14px;padding:14px;margin-top:12px;font-size:14px}
.ai-out p{margin:0 0 8px} .ai-out p:last-child{margin-bottom:0}
.ai-out ul,.ai-out ol{margin:0 0 8px;padding-left:20px} .ai-out li{margin-bottom:6px}
.ai-note{font-size:11.5px;opacity:.6;margin-top:10px}
.ask{display:flex;gap:8px;margin-top:10px}
.ask input{flex:1;min-width:0;border:1px solid transparent;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px}
.ask button{border:0;background:var(--surface);color:var(--ink);border-radius:12px;padding:0 14px;font-weight:600}
.qa{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.qa .q{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:13.5px;max-width:85%}

/* goals */
.goal h3{margin:0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.goal .meta{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.prog{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--save);border-radius:5px}
.goal .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:8px 12px;font-size:13px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:transparent}
.inl{display:flex;gap:8px;margin-top:10px}
.inl input{flex:1;min-width:0}
.field{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:9px 11px;width:100%}
.months{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em}
.settings .r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.settings .r + .r{border-top:1px solid var(--line)}
.settings .r span{font-size:14px}
.settings .r small{display:block;color:var(--muted);font-size:12px}

/* tabbar & fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{pointer-events:auto;width:100%;max-width:440px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) 8px max(8px,env(safe-area-inset-right,0px))}
@media (min-width:600px){.tabbar{bottom:24px}.tabbar nav{border:1px solid var(--line);border-radius:0 0 36px 36px;padding-bottom:14px}}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:500}
.tabbar button svg{width:22px;height:22px}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(30,92,71,.35);
  bottom:calc(84px + env(safe-area-inset-bottom,0px));right:max(18px,calc(50vw - 202px))}
@media (min-width:600px){.fab{bottom:120px}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;background:var(--surface);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{border:0;background:var(--surface-2);border-radius:50%;width:32px;height:32px;font-size:18px;color:var(--muted)}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);margin:16px 0 18px;padding-bottom:4px}
.amount:focus-within{border-color:var(--accent)}
.amount input{border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:36px;width:100%;outline:none;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.amount span{font-size:24px;color:var(--muted);font-weight:600}
.lbl2{font-size:12px;color:var(--muted);margin:14px 2px 6px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .actions{display:flex;gap:8px;margin-top:20px}
.sheet .actions .btn{flex:1;padding:13px;font-size:15px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:13px;z-index:40}
.fx{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px}
.fx + .fx{border-top:1px solid var(--line)}
.fx:hover{background:var(--surface-2)}
.fx b{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .am{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.fx .mt{font-size:12px;color:var(--muted);min-width:0}
.fx .st{justify-self:end}
.fx-sum{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.fx-sum .big2{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fx-add{width:100%;margin-top:12px}

/* ===== Overview in Apple style (scoped to .ios) ===== */
.ios{
  --i-bg:#F2F2F7; --i-card:#FFFFFF; --i-fill:#E9E9EE; --i-label:#000000; --i-label2:rgba(60,60,67,.62); --i-label3:rgba(60,60,67,.36);
  --i-sep:rgba(60,60,67,.18); --i-blue:#007AFF; --i-green:#34C759; --i-orange:#FF9500; --i-red:#FF3B30; --i-gray:#8E8E93;
  --i-ring-needs:#FF3B30; --i-ring-wants:#FF9500; --i-ring-save:#32ADE6; --i-spend:#FF9500;
  --i-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --i-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-family:var(--i-font); color:var(--i-label); letter-spacing:-.01em;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ios{
  --i-bg:#000000; --i-card:#1C1C1E; --i-fill:#2C2C2E; --i-label:#FFFFFF; --i-label2:rgba(235,235,245,.6); --i-label3:rgba(235,235,245,.3);
  --i-sep:rgba(84,84,88,.6); --i-blue:#0A84FF; --i-green:#30D158; --i-orange:#FF9F0A; --i-red:#FF453A; --i-gray:#8E8E93; --i-ring-needs:#FF453A; --i-ring-wants:#FF9F0A; --i-ring-save:#64D2FF; --i-spend:#FF9F0A;
}}
:root[data-theme="dark"] .ios{
  --i-bg:#000000; --i-card:#1C1C1E; --i-fill:#2C2C2E; --i-label:#FFFFFF; --i-label2:rgba(235,235,245,.6); --i-label3:rgba(235,235,245,.3);
  --i-sep:rgba(84,84,88,.6); --i-blue:#0A84FF; --i-green:#30D158; --i-orange:#FF9F0A; --i-red:#FF453A; --i-gray:#8E8E93; --i-ring-needs:#FF453A; --i-ring-wants:#FF9F0A; --i-ring-save:#64D2FF; --i-spend:#FF9F0A;
}
.app.is-ios{background:var(--i-bg-app,#F2F2F7)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .app.is-ios{background:#000}}
:root[data-theme="dark"] .app.is-ios{background:#000}
:root[data-theme="light"] .app.is-ios{background:#F2F2F7}
.ios .nav{display:flex;justify-content:space-between;align-items:center;padding-top:4px;min-height:40px}
.ios .mswitch{display:inline-flex;align-items:center;gap:2px;background:var(--i-fill);border-radius:999px;padding:2px}
.ios .mswitch button{border:0;background:transparent;width:32px;height:30px;border-radius:999px;color:var(--i-blue);font-size:20px;line-height:1;font-family:var(--i-font)}
.ios .mswitch span{font-size:15px;font-weight:600;min-width:112px;text-align:center}
.ios .gear{background:var(--i-fill);border:0;color:var(--i-blue)}
.ios .large{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.15;margin:10px 4px 14px}
.ios .icard{background:var(--i-card);border-radius:16px;overflow:hidden}

    t("2026-09-17","exp","Здоровье",3500,"Стоматолог"), t("2026-09-18","exp","Покупки",12000,"Кроссовки"),

    t("2026-09-27","exp","Кафе и рестораны",4300,"Кофе и завтраки"), t("2026-09-29","exp","Продукты",7000,"Супермаркет"),

    t("2026-10-01","exp","Жильё",55000,"Аренда"), t("2026-10-02","exp","Продукты",5300,"Супермаркет"),
    t("2026-10-03","exp","Транспорт",2300,"Проездной"), t("2026-10-04","exp","Кафе и рестораны",4600,"Бранч"),
    t("2026-10-05","exp","Подписки",399,"Музыка"), t("2026-10-05","exp","Подписки",599,"Онлайн-кино"),
    t("2026-10-07","exp","Продукты",6800,"Закупка на неделю"), t("2026-10-08","exp","Кафе и рестораны",3900,"Ужин"),
    t("2026-10-09","exp","Подписки",599,"Новый сервис: книги"), t("2026-10-10","inc","Зарплата",180000,"Зарплата за сентябрь"),
    t("2026-10-10","exp","Накопления",15000,"В подушку"), t("2026-10-11","exp","Покупки",14900,"Осенняя куртка"),
    t("2026-10-12","exp","Коммуналка и связь",8200,"ЖКХ, интернет, телефон"), t("2026-10-13","exp","Развлечения",4200,"Театр"),
    t("2026-10-14","exp","Продукты",7400,"Супермаркет"), t("2026-10-15","inc","Подработка",18000,"Проект для клиента"),
    t("2026-10-15","exp","Кафе и рестораны",5200,"День рождения друга"), t("2026-10-16","exp","Здоровье",1200,"Аптека"),
    t("2026-10-17","exp","Покупки",7000,"Товары для дома"), t("2026-10-18","exp","Транспорт",2900,"Такси"),
    t("2026-10-19","exp","Развлечения",3200,"Квест"), t("2026-10-20","exp","Кафе и рестораны",5800,"Кофе и обеды"),
    t("2026-10-21","exp","Продукты",7500,"Закупка на неделю"), t("2026-10-21","exp","Подписки",1399,"Облачное хранилище"),

  return {v:1,demo:true,currency:"RUB",tx,fixed:[

}
function emptyState(cur){return {v:1,demo:false,currency:cur||"RUB",tx:[],fixed:[],goals:[{id:"g1",kind:"fund",name:"Подушка безопасности",target:0,saved:0}]};}

/* ---------- state & persistence ---------- */
const LS="kapital-mesyatsa-v1";
const STANDALONE=!!window.__STANDALONE__;
let S = null, db=null, docRef=null, storeMode="local";
try{ const raw=localStorage.getItem(LS); if(raw) S=JSON.parse(raw);}catch(e){}
if(!S||!Array.isArray(S.tx)) S=emptyState("RUB");

let saveTimer=null;
function persist(){
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  clearTimeout(saveTimer);
  if(docRef) saveTimer=setTimeout(()=>{docRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{storeMode="local";});},400);
}
async function connectStore(){
  try{
    if(!window.claude?.use) return;
    const [u,d]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(!u||!d) return;
    const id=await u.id(); if(!id) return;
    db=d; docRef=db.doc("data/users/"+id+"/finance");
    const snap=await docRef.get();
    if(snap.exists){ const data=snap.data(); if(data&&Array.isArray(data.tx)){S=JSON.parse(JSON.stringify(data)); try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} } }
    else { await docRef.set(JSON.parse(JSON.stringify(S))); }
    storeMode="account"; render();
  }catch(e){ docRef=null; storeMode="local"; }
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});
const money=(v,sign)=>{const s=nf.format(Math.round(Math.abs(v)))+" "+CUR[S.currency]; if(sign) return (v<0?"−":"+")+s; return (v<0?"−":"")+s;};
const pct=v=>Math.round(v*100)+"%";
const mkOf=d=>d.slice(0,7);
const now=new Date();
const todayISO=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
const realMK=todayISO.slice(0,7);
const shiftMK=(mk,k)=>{let [y,m]=mk.split("-").map(Number); m+=k; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return `${y}-${String(m).padStart(2,"0")}`;};
const mkLabel=mk=>{const [y,m]=mk.split("-").map(Number);return MONTHS[m-1][0].toUpperCase()+MONTHS[m-1].slice(1)+" "+y;};
const mkPrep=mk=>MONTHS_PREP[Number(mk.slice(5))-1];
const daysIn=mk=>{const [y,m]=mk.split("-").map(Number);return new Date(y,m,0).getDate();};
const uid=()=>Math.random().toString(36).slice(2,10);
function catColor(t){ if(t.type==="inc") return "var(--good)"; return GROUP[CATS[t.cat]?.g||"wants"].c; }

let mk = (()=>{ if(S.tx.some(t=>mkOf(t.date)===realMK)) return realMK; const ds=S.tx.map(t=>t.date).sort(); return ds.length?mkOf(ds[ds.length-1]):realMK; })();
let tab="home", txFilter="all";
try{ const h=location.hash.slice(1); if(["home","ops","fixed","tips","fund"].includes(h)) tab=h; }catch(e){}

/* ---------- analytics ---------- */
function matchFixed(month){
  const items=(S.fixed||[]).filter(f=>!f.from||f.from<=month);
  const exps=S.tx.filter(t=>t.type==="exp"&&mkOf(t.date)===month);
  const used=new Set(), byTx={}, paid=[], pending=new Map(items.map(f=>[f.id,f]));
  const near=(a,b)=>Math.abs(a-b)<=Math.max(1,b*.02);
  const lw=v=>String(v??"").toLowerCase();
  const tries=[(f,t)=>t.cat===f.cat,(f,t)=>lw(t.note).includes(lw(f.name).slice(0,6)),()=>true];
  for(const test of tries) for(const f of [...pending.values()]){
    const t=exps.find(t=>!used.has(t.id)&&near(t.amount,f.amount)&&test(f,t));
    if(t){ used.add(t.id); byTx[t.id]=f; paid.push({f,t}); pending.delete(f.id); }
  }
  return {items,byTx,paid,expected:[...pending.values()]};
}
function stats(month, uptoDay){
  const list=S.tx.filter(t=>mkOf(t.date)===month && (!uptoDay || Number(t.date.slice(8))<=uptoDay));
  const M=matchFixed(month);
  const r={income:0,needs:0,wants:0,save:0,other:0,cats:{},incCats:{},list,fixed:0,variable:0,expectedSum:0,M};
  for(const t of list){
    if(t.type==="inc"){r.income+=t.amount; r.incCats[t.cat]=(r.incCats[t.cat]||0)+t.amount; continue;}
    const mf=M.byTx[t.id], cat=mf?mf.cat:t.cat;
    const c=CATS[cat]||{g:"wants"}; r[c.g]+=t.amount; r.cats[cat]=(r.cats[cat]||0)+t.amount;
    if(c.g!=="save"){ if(mf||c.fixed||c.g==="other") r.fixed+=t.amount; else r.variable+=t.amount; }
  }
  for(const f of M.expected){
    if(uptoDay&&(f.day||1)>uptoDay) continue;
    const c=CATS[f.cat]||{g:"needs"}; r[c.g]+=f.amount; r.cats[f.cat]=(r.cats[f.cat]||0)+f.amount; r.expectedSum+=f.amount;
    if(c.g!=="save") r.fixed+=f.amount;
  }
  r.spend=r.needs+r.wants+r.other; r.free=r.income-r.spend-r.save;
  return r;
}
function progressOf(month){ // in-progress info for the real current month
  if(month!==realMK) return null;
  const day=now.getDate(), dim=daysIn(month); return {day,dim};
}
function monthlyNeeds(){ // average needs over months with data, excluding the in-progress month if others exist
  const months=[...new Set(S.tx.map(t=>mkOf(t.date)))].sort();
  const full=months.filter(m=>m!==realMK); const use=(full.length?full:months).slice(-3);
  if(!use.length) return 0;
  return use.reduce((a,m)=>a+stats(m).needs,0)/use.length;
}
function monthlyEssentials(){
  // what has to be paid each month even without income: needs + debt payments + everything the user listed as obligatory
  const fixedSum=(S.fixed||[]).reduce((a,f)=>a+f.amount,0);
  const months=new Set(S.tx.map(t=>mkOf(t.date))); if((S.fixed||[]).length) months.add(realMK);
  const sorted=[...months].sort(); const full=sorted.filter(m=>m!==realMK);
  const use=(full.length?full:sorted).slice(-3);

function buildHints(month){
  const H=[]; const s=stats(month); const p=progressOf(month);
  const prev=stats(shiftMK(month,-1), p?p.day:0);
  const inc=s.income;
  if(!s.list.length){ H.push({lv:"info",t:"В этом месяце пока нет операций",d:"Добавьте доход и первые расходы кнопкой «+», и здесь появится разбор."}); return H; }
  if(inc<=0){ H.push({lv:"warn",t:"Доход за месяц не внесён",d:"Без дохода нельзя посчитать доли и норму накоплений. Добавьте зарплату или другие поступления."}); }

  // pace projection for the in-progress month
  let projSpend=s.spend, projFree=s.free;
  if(p && inc>0){
    projSpend=s.fixed+s.variable/p.day*p.dim; projFree=inc-projSpend-s.save;
    if(projFree<0) H.push({lv:"bad",t:"При текущем темпе денег до конца месяца не хватит",d:`Прогноз расходов к ${p.dim} ${MONTHS_GEN[Number(month.slice(5))-1]}: <b>${money(projSpend)}</b>. Это на <b>${money(-projFree)}</b> больше, чем осталось после накоплений. ${(()=>{const left=inc-s.save-s.spend, days=p.dim-p.day+1; return left>0?`Чтобы уложиться в доход, тратьте не больше <b>${money(left/days)}</b> в день до конца месяца.`:`Доход месяца уже израсходован на <b>${money(-left)}</b> сверх. До конца месяца лучше тратить только на самое необходимое и не брать в долг.`;})()}`});
    else H.push({lv:"info",t:`Прогноз на конец месяца: свободно ${money(projFree)}`,d:`Сейчас вы тратите в среднем <b>${money(s.variable/p.day)}</b> в день на переменные расходы. Если темп сохранится, к концу месяца останется около <b>${money(projFree)}</b>.`});
  }
  if(inc>0){
    const base={needs:s.needs,wants:s.wants};

      H.push({lv:"warn",t:`${money(s.other)} без категории`,d:`Это ${n} операций: переводы людям и платежи, по которым непонятно, на что ушли деньги. Пока они не разнесены, доли нужд и желаний неточные. Откройте «Операции» → «Без категории» и выберите для каждой категорию: например, перевод за квартиру — «Жильё».`}); }
    const nS=base.needs/inc, wS=base.wants/inc;
    const saveRate=(s.save+Math.max(0,p?projFree:s.free))/inc;
    const tN=GROUP.needs.target, tW=GROUP.wants.target, tS=GROUP.save.target;
    if(nS>tN+.05) H.push({lv:nS>tN+.15?"bad":"warn",t:`Обязательные расходы занимают ${pct(nS)} дохода`,d:`Ваш ориентир — до ${pct(tN)}. Крупнейшая статья: <b>${topCat(s,"needs")}</b>. Если это аренда, сравните её с рынком или пересмотрите при продлении договора.`});
    if(wS>tW){ const tc=topCat(s,"wants"); H.push({lv:wS>tW+.1?"bad":"warn",t:`Желания — ${pct(wS)} дохода при ориентире ${pct(tW)}`,d:`${p?"Уже сейчас, к "+p.day+"-му числу. ":""}Чтобы вернуться к норме, сократите их примерно на <b>${money(base.wants-inc*tW)}</b> в месяц. Больше всего уходит на <b>${tc}</b>.`}); }
    if(tS>0&&saveRate<tS/2) H.push({lv:"bad",t:`Откладывается всего ${pct(saveRate)} дохода`,d:`Ваш ориентир — ${pct(tS)}. Начните с автоматического перевода <b>${money(inc*tS/2)}</b> в день зарплаты, ещё до трат, и постепенно доведите до <b>${money(inc*tS)}</b>.`});
    else if(saveRate<tS) H.push({lv:"warn",t:`Норма накоплений ${pct(saveRate)} — близко к цели`,d:`До вашего ориентира ${pct(tS)} не хватает <b>${money(inc*tS-saveRate*inc)}</b> в месяц.`});
    else H.push({lv:"good",t:`Вы откладываете ${pct(saveRate)} дохода`,d:`Это не ниже вашего ориентира ${pct(tS)}. Следите, чтобы свободный остаток в конце месяца действительно уходил в накопления или инвестиции.`});

  if(p){ const up=s.M.expected.filter(f=>(f.day||1)>=p.day).sort((a,b)=>(a.day||1)-(b.day||1));
    if(up.length) H.push({lv:"info",t:`Впереди обязательные платежи на ${money(up.reduce((a,f)=>a+f.amount,0))}`,d:up.slice(0,4).map(f=>`<b>${esc(f.name)}</b> ${f.day?f.day+"-го":""} — ${money(f.amount)}`).join(", ")+(up.length>4?" и другие":"")+". Эти деньги уже вычтены из свободного остатка."}); }
  // emergency fund
  const f=fundInfo();
  if(f.needs>0 && f.months<3){
    const gap=Math.max(0,f.needs*3-(f.g?.saved||0));
    H.push({lv:f.months<1?"bad":"warn",t:`Подушка покрывает ${f.months.toFixed(1).replace(".",",")} мес. обязательных расходов`,d:`Минимум — 3 месяца, комфортно — 6. До трёх месяцев не хватает <b>${money(gap)}</b>: это <b>${money(gap/6)}</b> в месяц, если собрать за полгода. Держите подушку на накопительном счёте с процентом, а не в инвестициях.`});
  } else if(f.needs>0 && f.months>=6){
    H.push({lv:"good",t:"Подушка безопасности собрана",d:`Её хватит на ${Math.floor(f.months)} мес. Новые свободные деньги можно направлять в долгосрочные инвестиции и цели.`});
  }
  // growth by category vs previous month (same period if in progress)
  const grow=[];
  for(const [c,v] of Object.entries(s.cats)){ const g=CATS[c]?.g; if(g==="save") continue; const pv=prev.cats[c]||0;
    if(pv>0 && v>pv*1.25 && v-pv>Math.max(2000,inc*.015)) grow.push([c,v,pv]); }
  grow.sort((a,b)=>(b[1]-b[2])-(a[1]-a[2]));
  for(const [c,v,pv] of grow.slice(0,2))
    H.push({lv:"warn",t:`${c}: +${Math.round((v/pv-1)*100)}% к прошлому месяцу`,d:`${p?"За то же число":"За месяц"} потрачено <b>${money(v)}</b> против <b>${money(pv)}</b>. Разница — <b>${money(v-pv)}</b>.`});
  // subscriptions
  const subs=s.list.filter(t=>t.cat==="Подписки");
  if(subs.length>=3){ const sum=subs.reduce((a,t)=>a+t.amount,0);
    H.push({lv:"info",t:`${subs.length} подписок на ${money(sum)} в месяц`,d:`В год это <b>${money(sum*12)}</b>. Проверьте, какими сервисами вы пользовались в последние 30 дней, и отключите остальные.`}); }
  // distribute free money
  const freeM=p?projFree:s.free;
  if(inc>0 && freeM>1000){
    const plan=f.months<3?[["в подушку безопасности",.6],["в инвестиции",.25],["на цели",.15]]:[["в долгосрочные инвестиции",.5],["на цели",.3],["в резерв на крупные траты",.2]];
    H.push({lv:"good",t:`Куда направить ${money(freeM)}`,d:plan.map(([n,k])=>`<b>${money(freeM*k)}</b> ${n}`).join(", ")+"."+(p?" Сумма рассчитана по прогнозу на конец месяца.":"")});

}

(function parallax(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cur={x:0,y:0}, tgt={x:0,y:0}; let touch={x:0,y:0}, raf=0;
  const clamp=v=>Math.max(-1,Math.min(1,v));
  function aim(){
    const card=document.getElementById("ringsCard"); if(!card) return false;
    const r=card.getBoundingClientRect();
    const sy=clamp((r.top+r.height/2-innerHeight/2)/(innerHeight/2)); // −1 above centre … 1 below
    tgt.x=touch.x; tgt.y=clamp(sy*.9+touch.y);
    return true;
  }
  function frame(){
    raf=0; if(!aim()) return;
    cur.x+= (tgt.x-cur.x)*.14; cur.y+=(tgt.y-cur.y)*.14;
    const card=document.getElementById("ringsCard");
    card.querySelectorAll(".plx").forEach(el=>{ const d=+el.dataset.depth;
      el.style.transform=`translate(${(cur.x*d*2.6).toFixed(2)}px,${(cur.y*d*2.6).toFixed(2)}px)`; });
    const svg=card.querySelector(".plx-svg");
    if(svg) svg.style.transform=`rotateX(${(-cur.y*10).toFixed(2)}deg) rotateY(${(cur.x*10).toFixed(2)}deg)`;
    if(Math.abs(tgt.x-cur.x)>.002||Math.abs(tgt.y-cur.y)>.002) raf=requestAnimationFrame(frame);
  }
  const kick=()=>{ if(!raf) raf=requestAnimationFrame(frame); };
  addEventListener("scroll",kick,{passive:true});
  addEventListener("resize",kick);
  document.addEventListener("pointermove",e=>{ const card=e.target.closest&&e.target.closest("#ringsCard"); if(!card){ if(touch.x||touch.y){ touch={x:0,y:0}; kick(); } return; }
    const r=card.getBoundingClientRect(); touch={x:clamp((e.clientX-r.left)/r.width*2-1),y:clamp((e.clientY-r.top)/r.height*2-1)*.6}; kick(); },{passive:true});
  const reset=e=>{ if(touch.x||touch.y){ touch={x:0,y:0}; kick(); } };
  document.addEventListener("pointerup",reset,true); document.addEventListener("pointercancel",reset,true);
  window.__plxKick=kick;
})();

function goalActions(g){

  return `<div class="row"><button class="btn primary" data-topup-open="${esc(g.id)}">Пополнить</button>${g.kind!=="fund"?`<button class="btn danger ${armed==="g"+g.id?"armed":""}" data-del-goal="${esc(g.id)}">${armed==="g"+g.id?"Удалить?":"Удалить"}</button>`:""}</div>`;
}
function md(src){
  const lines=esc(src).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n/);
  let out="",list=null;
  for(let l of lines){ const m=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if(m){ if(!list){list=/^\s*\d/.test(l)?"ol":"ul";out+=`<${list}>`;} out+=`<li>${m[1]}</li>`; continue; }
    if(list){out+=`</${list}>`;list=null;}
    l=l.replace(/^#+\s*/,""); if(l.trim()) out+=`<p>${l}</p>`; }
  if(list) out+=`</${list}>`; return out;
}

const RULES=`Ты — внимательный личный финансовый аналитик в мобильном приложении. Отвечай по-русски, коротко и конкретно, с суммами в валюте пользователя. Опирайся только на данные ниже, не выдумывай цифр. Не советуй конкретные ценные бумаги или банки; говори о типах инструментов. Если месяц ещё идёт, учитывай это.`;
function aiErrorText(e){ const c=e?.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed"){ sampleNS=null; return ""; }
  if(c==="rate_limited") return "Слишком много запросов. Попробуйте через несколько минут.";
  if(c==="session_expired") return "Сессия истекла. Войдите в Claude снова и повторите.";
  if(c==="refused") return "Claude не смог ответить на этот запрос. Переформулируйте вопрос.";
  return "Не удалось получить ответ. Проверьте соединение и попробуйте ещё раз.";
}
async function getSample(){ if(STANDALONE) return sampleNS=null; if(sampleNS===undefined){ try{ sampleNS=window.claude?.use?await claude.use("sample"):null; }catch(e){sampleNS=null;} } return sampleNS; }
async function runAI(){
  const sm=await getSample(); if(!sm){render();return;}
  aiBusy=true; aiErr=""; aiText="Думаю…"; render();
  const prompt=`${RULES}

Сделай разбор месяца. Формат: одно вводное предложение с главным выводом, затем 4–6 пунктов списком, каждый начинается с **короткого заголовка** и содержит конкретное действие с суммой. Последний пункт — как распределить свободные деньги в этом месяце. Без вступлений и заключений сверх этого.

ДАННЫЕ:
${monthSummary()}`;
  try{ const r=await sm(prompt,{cache:false,onText:({text})=>{aiText=text; const o=$("#aiOut"); if(o) o.innerHTML=md(text);}}); aiText=r.text; }
  catch(e){ aiText=e?.text||""; aiErr=aiText?"":aiErrorText(e); }

}
async function askAI(q){
  const sm=await getSample(); if(!sm){render();return;}
  if(!chat.length) chat.push({role:"user",hidden:true,content:`${RULES}\nОтвечай на вопросы пользователя в 2–6 предложениях или коротким списком.\n\nДАННЫЕ:\n${monthSummary()}`});
  chat.push({role:"user",content:q}); aiBusy=true; render();
  const holder={role:"assistant",content:"Думаю…"}; chat.push(holder); render();
  const turns=chat.slice(0,-1).map(m=>({role:m.role,content:m.content}));
  try{ const r=await sm(turns,{cache:false,onText:({text})=>{holder.content=text; const all=document.querySelectorAll("#qa .ai-out"); const last=all[all.length-1]; if(last) last.innerHTML=md(text);}}); holder.content=r.text; }
  catch(e){ const msg=e?.text||aiErrorText(e); if(msg) holder.content=msg; else chat.pop(); }
  aiBusy=false; render();
}

const low=v=>String(v??"").toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim();
const p2=n=>String(n).padStart(2,"0");
function parseCSV(text){
  const first=text.split(/\r?\n/).slice(0,15).join("\n");
  const cnt=d=>first.split(d).length-1;
  const delim=[";","\t",","].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){row.push(cell);cell="";}
    else if(ch==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
    else if(ch!=="\r") cell+=ch; }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function parseNum(v){
  if(typeof v==="number") return v;
  let s=String(v??"").replace(/[\s  ]/g,"").replace(/−|–/g,"-");
  const neg=/^-|-$|^\(.*\)$/.test(s.replace(/[^\d,.\-()]/g,""));
  s=s.replace(/[^\d,.]/g,""); if(!s) return NaN;
  if(s.includes(",")&&s.includes(".")) s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  else s=s.replace(",",".");
  const n=parseFloat(s); return neg?-n:n;
}
function parseDate(v){
  if(v instanceof Date&&!isNaN(v)) return `${v.getFullYear()}-${p2(v.getMonth()+1)}-${p2(v.getDate())}`;
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())}`;}
  const s=String(v??"").trim(); let m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);
  if(m){let y=+m[3]; if(y<100) y+=2000; if(+m[2]>12) return null; return `${y}-${p2(m[2])}-${p2(m[1])}`;}

function guessCat(type,desc,bcat){
  const d=low(desc), b=low(bcat);
  if(type==="inc"){ if(/зарплат|заработн|аванс|\bзп\b|salary|оплата труда/.test(d+" "+b)) return "Зарплата";
    if(/процент|кешб|кэшб|cashback|дивиден|купон/.test(d+" "+b)) return "Проценты и дивиденды"; return "Другой доход"; }
  for(const [re,c] of DESCCAT) if(re.test(d)) return c;
  if(b) for(const [re,c] of BANKCAT) if(re.test(b)) return c;
  return "Переводы и прочее";
}
function buildItems(rows,map,existing){
  const items=[]; let neg=0,pos=0; const warn=[];
  for(let i=map.hdr+1;i<rows.length;i++){ const r=rows[i]; if(!r||r.every(c=>String(c??"").trim()==="")) continue;
    const date=parseDate(r[map.date]); if(!date) continue;
    if(map.status>=0&&/отклон|отмен|неуспеш|ошибк/.test(low(r[map.status]))) continue;
    let type="exp",amount;
    if(map.inc>=0&&map.exp>=0){ const a=parseNum(r[map.inc]),b=parseNum(r[map.exp]);
      if(a>0){type="inc";amount=a;} else if(isFinite(b)&&b!==0){type="exp";amount=Math.abs(b);} else continue; }
    else { const v=parseNum(r[map.amt]); if(!isFinite(v)||v===0) continue; amount=Math.abs(v); type=v<0?"exp":"inc"; v<0?neg++:pos++;
      const tp=map.type>=0?low(r[map.type]):"";
      if(/списан|покупк|расход|оплат|снят/.test(tp)) type="exp"; else if(/пополн|зачисл|поступл|приход|возврат/.test(tp)) type="inc"; }
    const desc=map.desc>=0?String(r[map.desc]??"").replace(/\s+/g," ").trim():"";
    const bcat=map.cat>=0?String(r[map.cat]??"").trim():"";
    items.push({date,type,amount:Math.round(amount*100)/100,desc,bcat});
  }
  if(map.amt>=0&&map.type<0&&neg===0&&pos>0){
    items.forEach(it=>{ it.type=/зарплат|заработн|аванс|пополнен|зачислен|кешб|кэшб|процент/.test(low(it.desc+" "+it.bcat))?"inc":"exp"; });
    warn.push("В файле все суммы без знака. Приход определён по описанию, остальное считаем расходом. Нажмите на сумму, чтобы поменять доход и расход.");
  }
  const seen=new Set((existing||[]).map(t=>`${t.date}|${t.type}|${Math.round(t.amount*100)}`));
  for(const it of items){
    let c=guessCat(it.type,it.desc,it.bcat);
    it.own=c==="__own"; if(it.own) c="Переводы и прочее";
    it.cat=c; it.auto=c!=="Переводы и прочее"&&c!=="Другой доход";
    it.dup=seen.has(`${it.date}|${it.type}|${Math.round(it.amount*100)}`);
    it.on=!it.dup&&!it.own;
  }
  if(items.some(i=>i.dup)) warn.push("Часть операций уже есть в приложении — они не отмечены, чтобы не добавить их дважды.");
  if(items.some(i=>i.own)) warn.push("Переводы между своими счетами не отмечены: это не доход и не расход.");
  return {items,warn};
}

async function readRows(file){
  const buf=await file.arrayBuffer(); const name=file.name.toLowerCase(); const h=new Uint8Array(buf.slice(0,5));
  if(h[0]===0x25&&h[1]===0x50&&h[2]===0x44&&h[3]===0x46) throw {user:"Это PDF. Приложение читает выписки в формате Excel или CSV: скачайте выписку ещё раз и выберите Excel."};
  const xl=(h[0]===0x50&&h[1]===0x4B)||(h[0]===0xD0&&h[1]===0xCF)||/\.xlsx?$/.test(name);
  const text=xl?null:decodeText(buf);
  if(xl||/^\s*</.test(text)){
    let X; try{X=await loadXLSX();}catch(e){throw {user:"Не удалось загрузить модуль для чтения Excel. Проверьте интернет и попробуйте ещё раз."};}
    const wb=xl?X.read(buf,{type:"array",cellDates:true}):X.read(text,{type:"string",cellDates:true});
    let best=[]; for(const n of wb.SheetNames){ const r=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}); if(r.length>best.length) best=r; }
    return best;
  }

}

    case "edit-map": IMP.editMap=true; drawImport(); break;
    case "apply-map": {
      const m=IMP.map; if(m.date<0||(m.amt<0&&(m.inc<0||m.exp<0))){ IMP.err="Нужно выбрать дату и сумму (или приход и расход)."; drawImport(); break; }
      if(m.amt>=0){m.inc=-1;m.exp=-1;}
      const r=buildItems(IMP.rows,m,S.tx); Object.assign(IMP,r); IMP.editMap=!r.items.length; IMP.err=r.items.length?"":"По выбранным столбцам операций не нашлось. Попробуйте другие.";
      drawImport(); break; }
    case "ai": aiCategorize(); break;
    case "commit": commitImport(); break;
  }
});
document.getElementById("layer").addEventListener("change",e=>{
  if(!IMP) return; const t=e.target;
  if(t.id==="impFile"&&t.files?.[0]){ handleFile(t.files[0]); return; }
  if(t.dataset.on){ IMP.items[+t.dataset.on].on=t.checked; drawImport(); return; }
  if(t.dataset.cat){ const it=IMP.items[+t.dataset.cat]; it.cat=t.value; it.auto=true; drawImport(); return; }
  if(t.dataset.map){ IMP.map[t.dataset.map]=+t.value; }
});

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-tab]"); if(!el||el.closest("#layer")) return;
  if(el.dataset.tab){ tab=el.dataset.tab; armed=null; topup=null; fundOp=null; fundEdit=null; render(); window.scrollTo(0,0); return; }
  if(el.dataset.catf){ tab="ops"; txFilter="cat:"+el.dataset.catf; render(); window.scrollTo(0,0); return; }
  if(el.hasAttribute("data-goto-other")){ tab="ops"; txFilter="other"; render(); window.scrollTo(0,0); return; }
  if(el.dataset.filter){ txFilter=el.dataset.filter; render(); return; }
  if(el.dataset.fm&&fundEdit){ fundEdit.saved=$("#feSaved")?.value??fundEdit.saved; if($("#feTarget")) fundEdit.target=$("#feTarget").value;
    if(el.dataset.fm==="custom") fundEdit.mode="custom"; else {fundEdit.mode="auto"; fundEdit.months=+el.dataset.fm;} render(); return; }
  if(el.dataset.fx){ openFixedSheet((S.fixed||[]).find(f=>f.id===el.dataset.fx)); return; }
  if(el.dataset.edit){ openSheet(S.tx.find(t=>t.id===el.dataset.edit)); return; }
  if(el.dataset.topupOpen){ topup=el.dataset.topupOpen; render(); setTimeout(()=>$("#topAmt")?.focus(),30); return; }
  if(el.dataset.delGoal){ const k="g"+el.dataset.delGoal; if(armed!==k){armed=k;render();return;} S.goals=S.goals.filter(g=>g.id!==el.dataset.delGoal); armed=null; persist(); render(); toast("Цель удалена"); return; }
  switch(el.dataset.act){
    case "prev": mk=shiftMK(mk,-1); aiText="";aiErr="";chat=[]; render(); break;
    case "next": mk=shiftMK(mk,1); aiText="";aiErr="";chat=[]; render(); break;
    case "clear-demo": resetAll(); break;
    case "ai": runAI(); break;
    case "import": openImport(); break;
    case "add-fixed": openFixedSheet(null); break;
    case "add-goal": goalForm.add=true; render(); setTimeout(()=>$("#gName")?.focus(),30); break;
    case "cancel-goal": goalForm.add=false; render(); break;
    case "cancel-top": topup=null; render(); break;
    case "settings": openSettings(); break;
    case "fund-add": fundOp="add"; fundEdit=null; render(); setTimeout(()=>$("#foAmt")?.focus(),30); break;
    case "fund-take": fundOp="take"; fundEdit=null; render(); setTimeout(()=>$("#foAmt")?.focus(),30); break;
    case "fund-edit": { const g=S.goals.find(x=>x.kind==="fund")||{saved:0,target:0,months:6};
      fundEdit={saved:g.saved||"",mode:g.target?"custom":"auto",months:g.months||6,target:g.target||""}; fundOp=null; render(); break; }
    case "fund-cancel": fundOp=null; fundEdit=null; render(); break;
    case "load-demo": if(armed!=="demo"){armed="demo";render();break;} S=demoState(); S.currency=S.currency||"RUB"; armed=null; mk="2026-10"; persist(); render(); toast("Пример данных загружен"); break;
    case "wipe": if(armed!=="wipe"){armed="wipe";render();break;} S=emptyState(S.currency); armed=null; persist(); render(); toast("Данные удалены"); break;
  }
});
$("#fab").addEventListener("click",()=>openSheet(null));
document.addEventListener("submit",e=>{
  if(e.target.id==="askForm"){ e.preventDefault(); const q=$("#askInput").value.trim(); if(q&&!aiBusy) askAI(q); return; }
  if(e.target.id==="fundOpForm"){ e.preventDefault(); const a=parseAmt($("#foAmt").value); const err=$("#foErr");
    if(!a){err.textContent="Введите сумму больше нуля.";err.hidden=false;return;}
    const g=ensureFund();
    if(fundOp==="add"){ g.saved+=a; S.tx=S.tx.concat([{id:uid(),type:"exp",cat:"Накопления",amount:a,note:"В подушку безопасности",date:todayISO}]); toast("Подушка пополнена на "+money(a)); }
    else { if(a>g.saved){err.textContent=`В подушке только ${money(g.saved)}.`;err.hidden=false;return;} g.saved-=a; toast("Снято "+money(a)); }
    fundOp=null; persist(); render(); return; }
  if(e.target.id==="fundEditForm"){ e.preventDefault(); const err=$("#feErr");
    const sv=$("#feSaved").value.trim(); const saved=(sv===""||/^0+([.,]0*)?$/.test(sv))?0:parseAmt(sv);
    if(saved===null){err.textContent="Проверьте сумму накоплений.";err.hidden=false;return;}
    let target=0; if(fundEdit.mode==="custom"){ target=parseAmt($("#feTarget").value); if(!target){err.textContent="Введите сумму цели.";err.hidden=false;return;} }
    const g=ensureFund(); g.saved=saved; g.target=target; g.months=fundEdit.months||6;
    fundEdit=null; persist(); render(); toast("Сохранено"); return; }
  if(e.target.id==="goalForm"){ e.preventDefault(); const n=$("#gName").value.trim(), a=parseAmt($("#gTarget").value); if(!n||!a) return;
    S.goals.push({id:uid(),kind:"goal",name:n,target:a,saved:0}); goalForm.add=false; persist(); render(); toast("Цель создана"); return; }
  if(e.target.dataset.topup){ e.preventDefault(); const a=parseAmt($("#topAmt").value); if(!a) return; const g=S.goals.find(g=>g.id===e.target.dataset.topup); if(!g) return;
    g.saved+=a; S.tx.push({id:uid(),type:"exp",cat:"Накопления",amount:a,note:"Пополнение: "+g.name,date:mk===realMK?todayISO:mk+"-"+String(daysIn(mk)).padStart(2,"0")});
    topup=null; persist(); render(); toast("Внесено "+money(a)); }
});

document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#layer").innerHTML){ $("#layer").innerHTML=""; IMP=null; } });

(()=>{ let had=false; const L=document.getElementById("layer");
  new MutationObserver(()=>{ const sh=L.querySelector(".sheet"); if(sh&&had) sh.classList.add("noanim"); had=!!sh; }).observe(L,{childList:true}); })();
render();
connectStore();
getSample().then(()=>{ if(tab==="tips") render(); });
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
